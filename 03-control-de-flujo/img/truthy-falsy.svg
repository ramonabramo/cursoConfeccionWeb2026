<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Valores truthy y falsy</title>
  <desc>Los seis valores falsy que usaremos y algunos valores truthy que sorprenden.</desc>
  <rect width="900" height="340" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">¿Qué cuenta como «falso» en un if?</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Dentro de una condición, cualquier valor se interpreta como verdadero o falso</text>

  <!-- falsy -->
  <rect x="24" y="88" width="414" height="232" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="120" font-size="17" font-weight="700" fill="#b91c1c">FALSY · se comportan como false</text>
  <text x="44" y="142" font-size="12" fill="#475569">La lista es corta: aprendéosla</text>
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#991b1b">
    <rect x="44" y="160" width="110" height="40" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="99" y="186" text-anchor="middle">false</text>
    <rect x="166" y="160" width="110" height="40" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="221" y="186" text-anchor="middle">0</text>
    <rect x="288" y="160" width="130" height="40" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="353" y="186" text-anchor="middle">''</text>
    <rect x="44" y="212" width="110" height="40" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="99" y="238" text-anchor="middle">null</text>
    <rect x="166" y="212" width="110" height="40" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="221" y="238" text-anchor="middle">NaN</text>
    <rect x="288" y="212" width="130" height="40" rx="8" fill="#ffffff" stroke="#fca5a5"/><text x="353" y="238" text-anchor="middle">undefined</text>
  </g>
  <text x="44" y="290" font-size="12" fill="#475569">'' es el texto vacío. (Existen también -0 y 0n,</text>
  <text x="44" y="306" font-size="12" fill="#475569">que no usaremos.)</text>

  <!-- truthy -->
  <rect x="462" y="88" width="414" height="232" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="482" y="120" font-size="17" font-weight="700" fill="#15803d">TRUTHY · todo lo demás</text>
  <text x="482" y="142" font-size="12" fill="#475569">Incluidos estos, que engañan:</text>
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#166534">
    <rect x="482" y="160" width="110" height="40" rx="8" fill="#ffffff" stroke="#86efac"/><text x="537" y="186" text-anchor="middle">'0'</text>
    <rect x="604" y="160" width="120" height="40" rx="8" fill="#ffffff" stroke="#86efac"/><text x="664" y="186" text-anchor="middle">'false'</text>
    <rect x="736" y="160" width="120" height="40" rx="8" fill="#ffffff" stroke="#86efac"/><text x="796" y="186" text-anchor="middle">' '</text>
    <rect x="482" y="212" width="110" height="40" rx="8" fill="#ffffff" stroke="#86efac"/><text x="537" y="238" text-anchor="middle">-5</text>
    <rect x="604" y="212" width="120" height="40" rx="8" fill="#ffffff" stroke="#86efac"/><text x="664" y="238" text-anchor="middle">'Ana'</text>
    <rect x="736" y="212" width="120" height="40" rx="8" fill="#ffffff" stroke="#86efac"/><text x="796" y="238" text-anchor="middle">42</text>
  </g>
  <text x="482" y="290" font-size="12" fill="#475569">'0', 'false' y ' ' son textos NO vacíos → truthy.</text>
  <text x="482" y="306" font-size="12" fill="#475569">Un espacio en blanco ya no es un texto vacío.</text>
</svg>

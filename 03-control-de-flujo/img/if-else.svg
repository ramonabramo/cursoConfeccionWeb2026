<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>La escalera if, else if, else</title>
  <desc>Una nota recorre las condiciones de arriba abajo; entra por la primera que se cumple y se salta el resto.</desc>
  <rect width="900" height="520" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">La escalera if · else if · else</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Se comprueba de arriba abajo. Entra por la PRIMERA condición que se cumple y se salta las demás.</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>

  <!-- entrada -->
  <rect x="40" y="88" width="180" height="44" rx="22" fill="#1e293b"/>
  <text x="130" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">nota = 7.5</text>
  <line x1="130" y1="132" x2="130" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>

  <g font-size="14">
    <!-- 1 -->
    <rect x="40" y="154" width="180" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="130" y="182" text-anchor="middle" font-family="Consolas, Menlo, monospace" fill="#1e293b">if (nota &lt; 5)</text>
    <text x="236" y="182" font-size="12" fill="#b91c1c">✘ no</text>
    <line x1="130" y1="200" x2="130" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
    <line x1="280" y1="177" x2="560" y2="177" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="566" y="158" width="300" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="582" y="182" fill="#94a3b8">Suspenso</text>

    <!-- 2 -->
    <rect x="40" y="220" width="180" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="130" y="248" text-anchor="middle" font-family="Consolas, Menlo, monospace" fill="#1e293b">else if (nota &lt; 6)</text>
    <text x="236" y="248" font-size="12" fill="#b91c1c">✘ no</text>
    <line x1="130" y1="266" x2="130" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
    <line x1="280" y1="243" x2="560" y2="243" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="566" y="224" width="300" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="582" y="248" fill="#94a3b8">Aprobado</text>

    <!-- 3 -->
    <rect x="40" y="286" width="180" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="130" y="314" text-anchor="middle" font-family="Consolas, Menlo, monospace" fill="#1e293b">else if (nota &lt; 7)</text>
    <text x="236" y="314" font-size="12" fill="#b91c1c">✘ no</text>
    <line x1="130" y1="332" x2="130" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
    <line x1="280" y1="309" x2="560" y2="309" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="566" y="290" width="300" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="582" y="314" fill="#94a3b8">Bien</text>

    <!-- 4: se cumple -->
    <rect x="40" y="352" width="180" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="130" y="380" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#166534">else if (nota &lt; 9)</text>
    <text x="236" y="380" font-size="12" font-weight="700" fill="#15803d">✔ sí</text>
    <line x1="280" y1="375" x2="560" y2="375" stroke="#16a34a" stroke-width="3" marker-end="url(#v)"/>
    <rect x="566" y="354" width="300" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="582" y="381" font-weight="700" fill="#166534">Notable  ← se ejecuta este bloque</text>

    <!-- 5: saltado -->
    <rect x="40" y="410" width="180" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/>
    <text x="130" y="438" text-anchor="middle" font-family="Consolas, Menlo, monospace" fill="#94a3b8">else</text>
    <text x="236" y="438" font-size="12" fill="#94a3b8">no se mira</text>
    <rect x="566" y="414" width="300" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/>
    <text x="582" y="438" fill="#94a3b8">Sobresaliente</text>
  </g>

  <text x="450" y="488" text-anchor="middle" font-size="13" fill="#475569">El orden importa: cada condición solo se comprueba si las anteriores han fallado.</text>
    <text x="450" y="508" text-anchor="middle" font-size="13" fill="#475569">Por eso, en el cuarto escalón no hace falta escribir <tspan font-family="Consolas, Menlo, monospace" fill="#1d4ed8">nota &gt;= 7 &amp;&amp; nota &lt; 9</tspan></text>
</svg>

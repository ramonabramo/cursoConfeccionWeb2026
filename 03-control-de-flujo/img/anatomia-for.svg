<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Anatomía de un bucle for</title>
  <desc>Las tres partes de la cabecera de un for y el orden en que se ejecutan en cada vuelta.</desc>
  <rect width="900" height="440" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Anatomía de un bucle for</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Tres partes separadas por punto y coma, y un cuerpo que se repite</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <!-- código -->
  <rect x="110" y="90" width="680" height="96" rx="12" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="22">
    <text x="140" y="130" fill="#e2e8f0">for (</text>
    <text x="210" y="130" fill="#86efac">let i = 1</text>
    <text x="340" y="130" fill="#e2e8f0">;</text>
    <text x="362" y="130" fill="#fde047">i &lt;= 3</text>
    <text x="452" y="130" fill="#e2e8f0">;</text>
    <text x="474" y="130" fill="#93c5fd">i++</text>
    <text x="520" y="130" fill="#e2e8f0">) {</text>
    <text x="170" y="164" fill="#fca5a5">console.log(i);</text>
    <text x="410" y="164" fill="#e2e8f0">}</text>
  </g>

  <!-- etiquetas -->
  <g font-size="13" font-weight="700">
    <rect x="160" y="204" width="150" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="235" y="226" text-anchor="middle" fill="#166534">① Inicialización</text>
    <text x="235" y="246" text-anchor="middle" font-weight="400" font-size="12" fill="#166534">Una sola vez, al empezar</text>

    <rect x="330" y="204" width="150" height="54" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="405" y="226" text-anchor="middle" fill="#854d0e">② Condición</text>
    <text x="405" y="246" text-anchor="middle" font-weight="400" font-size="12" fill="#854d0e">Antes de cada vuelta</text>

    <rect x="500" y="204" width="150" height="54" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="575" y="226" text-anchor="middle" fill="#1e40af">④ Actualización</text>
    <text x="575" y="246" text-anchor="middle" font-weight="400" font-size="12" fill="#1e40af">Al final de cada vuelta</text>

    <rect x="670" y="204" width="150" height="54" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="745" y="226" text-anchor="middle" fill="#991b1b">③ Cuerpo</text>
    <text x="745" y="246" text-anchor="middle" font-weight="400" font-size="12" fill="#991b1b">Lo que se repite</text>
  </g>

  <!-- traza -->
  <text x="450" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Lo que ocurre, paso a paso</text>
  <g font-size="12.5" font-family="Consolas, Menlo, monospace">
    <rect x="40" y="306" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="54" y="330" fill="#166534">i = 1</text>
    <text x="54" y="352" fill="#854d0e">1 &lt;= 3 ✔</text>
    <text x="54" y="374" fill="#991b1b">muestra 1</text>
    <text x="54" y="396" fill="#1e40af">i++ → 2</text>

    <rect x="210" y="306" width="150" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="224" y="352" fill="#854d0e">2 &lt;= 3 ✔</text>
    <text x="224" y="374" fill="#991b1b">muestra 2</text>
    <text x="224" y="396" fill="#1e40af">i++ → 3</text>

    <rect x="380" y="306" width="150" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="394" y="352" fill="#854d0e">3 &lt;= 3 ✔</text>
    <text x="394" y="374" fill="#991b1b">muestra 3</text>
    <text x="394" y="396" fill="#1e40af">i++ → 4</text>

    <rect x="550" y="306" width="150" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="564" y="352" fill="#991b1b">4 &lt;= 3 ✘</text>
    <text x="564" y="374" fill="#991b1b">sale del bucle</text>
  </g>
  <line x1="190" y1="361" x2="206" y2="361" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <line x1="360" y1="361" x2="376" y2="361" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <line x1="530" y1="361" x2="546" y2="361" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <text x="720" y="340" font-size="12" fill="#475569">Vuelta 1 → vuelta 2 →</text>
  <text x="720" y="358" font-size="12" fill="#475569">vuelta 3 → fin.</text>
  <text x="720" y="382" font-size="12" fill="#475569">Tres vueltas,</text>
  <text x="720" y="400" font-size="12" fill="#475569">cuatro comprobaciones.</text>
</svg>

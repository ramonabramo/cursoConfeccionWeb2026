<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Operadores lógicos AND, OR y NOT</title>
  <desc>Tablas de verdad de los operadores lógicos con un ejemplo cotidiano para cada uno.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Operadores lógicos: &amp;&amp;  ||  !</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Combinan condiciones. El resultado siempre es true o false</text>

  <!-- AND -->
  <rect x="24" y="88" width="276" height="292" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="44" y="122" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#1d4ed8">&amp;&amp;</text>
  <text x="84" y="121" font-size="15" font-weight="700" fill="#1e3a8a">Y (AND)</text>
  <text x="44" y="144" font-size="12" fill="#475569">true solo si se cumplen LAS DOS</text>
  <text x="44" y="170" font-size="12" font-style="italic" fill="#334155">«Entras si eres mayor de edad</text>
  <text x="44" y="186" font-size="12" font-style="italic" fill="#334155">  Y tienes entrada»</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="44" y="222" fill="#1e293b">true  &amp;&amp; true </text><text x="232" y="222" font-weight="700" fill="#15803d">true</text>
    <text x="44" y="250" fill="#1e293b">true  &amp;&amp; false</text><text x="232" y="250" fill="#b91c1c">false</text>
    <text x="44" y="278" fill="#1e293b">false &amp;&amp; true </text><text x="232" y="278" fill="#b91c1c">false</text>
    <text x="44" y="306" fill="#1e293b">false &amp;&amp; false</text><text x="232" y="306" fill="#b91c1c">false</text>
  </g>
  <text x="44" y="350" font-size="12" fill="#1d4ed8">Basta un false para que todo sea false</text>

  <!-- OR -->
  <rect x="312" y="88" width="276" height="292" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="332" y="122" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#c2410c">||</text>
  <text x="364" y="121" font-size="15" font-weight="700" fill="#9a3412">O (OR)</text>
  <text x="332" y="144" font-size="12" fill="#475569">true si se cumple AL MENOS UNA</text>
  <text x="332" y="170" font-size="12" font-style="italic" fill="#334155">«Descuento si eres estudiante</text>
  <text x="332" y="186" font-size="12" font-style="italic" fill="#334155">  O jubilado»</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="332" y="222" fill="#1e293b">true  || true </text><text x="520" y="222" font-weight="700" fill="#15803d">true</text>
    <text x="332" y="250" fill="#1e293b">true  || false</text><text x="520" y="250" font-weight="700" fill="#15803d">true</text>
    <text x="332" y="278" fill="#1e293b">false || true </text><text x="520" y="278" font-weight="700" fill="#15803d">true</text>
    <text x="332" y="306" fill="#1e293b">false || false</text><text x="520" y="306" fill="#b91c1c">false</text>
  </g>
  <text x="332" y="350" font-size="12" fill="#c2410c">Basta un true para que todo sea true</text>

  <!-- NOT -->
  <rect x="600" y="88" width="276" height="292" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="620" y="122" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#6d28d9">!</text>
  <text x="640" y="121" font-size="15" font-weight="700" fill="#5b21b6">NO (NOT)</text>
  <text x="620" y="144" font-size="12" fill="#475569">Le da la vuelta al valor</text>
  <text x="620" y="170" font-size="12" font-style="italic" fill="#334155">«Si NO tienes entrada,</text>
  <text x="620" y="186" font-size="12" font-style="italic" fill="#334155">  pasa por taquilla»</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="620" y="222" fill="#1e293b">!true </text><text x="808" y="222" fill="#b91c1c">false</text>
    <text x="620" y="250" fill="#1e293b">!false</text><text x="808" y="250" font-weight="700" fill="#15803d">true</text>
  </g>
  <rect x="616" y="276" width="244" height="44" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="632" y="296" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1e293b">if (!tieneEntrada) {</text>
  <text x="632" y="312" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1e293b">  … }</text>
  <text x="620" y="350" font-size="12" fill="#6d28d9">Se lee «si no tiene entrada»</text>
</svg>

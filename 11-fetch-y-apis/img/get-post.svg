<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>GET frente a POST</title>
  <desc>GET pide datos sin cambiar nada en el servidor; los filtros van en la URL y es el método por defecto de fetch. POST envía datos: se indican method, la cabecera Content-Type y el cuerpo convertido con JSON.stringify.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">GET para pedir, POST para enviar</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">El método le dice al servidor qué queréis hacer con el recurso</text>

  <!-- GET -->
  <rect x="24" y="88" width="420" height="292" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="118" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#1d4ed8">GET</text>
  <text x="96" y="118" font-size="13" fill="#334155">📥 pedir datos, sin cambiar nada</text>
  <rect x="40" y="134" width="388" height="64" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">
    <text x="52" y="158">fetch(`${API}/posts<tspan fill="#fde047">?userId=3</tspan>`)</text>
    <text x="52" y="182" fill="#94a3b8">// sin opciones: GET por defecto</text>
  </g>
  <g font-size="12.5" fill="#334155">
    <text x="40" y="228">✔ Es lo que hace <tspan font-family="Consolas, Menlo, monospace">fetch</tspan> si no le decís otra cosa</text>
    <text x="40" y="252">✔ Los filtros van en la URL, detrás de <tspan font-family="Consolas, Menlo, monospace" font-weight="700">?</tspan></text>
    <text x="40" y="276">✔ No lleva cuerpo</text>
    <text x="40" y="300">✔ Repetirlo no cambia nada en el servidor</text>
  </g>
  <text x="40" y="350" font-size="12.5" font-weight="700" fill="#1d4ed8">Ejemplos: listar usuarios, buscar,</text>
  <text x="40" y="368" font-size="12.5" font-weight="700" fill="#1d4ed8">ver las tareas de un usuario</text>

  <!-- POST -->
  <rect x="456" y="88" width="420" height="292" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="472" y="118" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#15803d">POST</text>
  <text x="542" y="118" font-size="13" fill="#334155">📤 enviar datos nuevos</text>
  <rect x="472" y="134" width="388" height="118" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">
    <text x="484" y="156">fetch(`${API}/posts`, {</text>
    <text x="500" y="176"><tspan fill="#86efac">method</tspan>: 'POST',</text>
    <text x="500" y="196"><tspan fill="#86efac">headers</tspan>: { 'Content-Type':</text>
    <text x="580" y="214">'application/json' },</text>
    <text x="500" y="234"><tspan fill="#86efac">body</tspan>: JSON.stringify(datos), })</text>
  </g>
  <g font-size="12.5" fill="#334155">
    <text x="472" y="280"><tspan font-family="Consolas, Menlo, monospace" font-weight="700">method</tspan> · el método HTTP</text>
    <text x="472" y="302"><tspan font-family="Consolas, Menlo, monospace" font-weight="700">Content-Type</tspan> · en qué formato va el cuerpo</text>
    <text x="472" y="324"><tspan font-family="Consolas, Menlo, monospace" font-weight="700">body</tspan> · los datos, convertidos a texto</text>
  </g>
  <text x="472" y="358" font-size="12.5" font-weight="700" fill="#15803d">El servidor responde con lo que ha creado</text>
  <text x="472" y="376" font-size="12" fill="#475569">(en JSONPlaceholder, siempre con id 101)</text>
</svg>

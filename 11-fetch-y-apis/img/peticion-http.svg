<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Una petición HTTP a una API</title>
  <desc>El navegador envía una petición con un método y una URL; el servidor responde con un código de estado y datos en formato JSON. Debajo, las cinco familias de códigos de estado.</desc>
  <rect width="900" height="430" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Una petición, una respuesta</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Una API es una puerta que un servidor abre para que otros programas le pidan datos</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <rect x="24" y="92" width="220" height="150" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="134" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">💻 Vuestra página</text>
  <text x="134" y="146" text-anchor="middle" font-size="12" fill="#475569">(el cliente)</text>
  <rect x="44" y="160" width="180" height="62" rx="8" fill="#1e293b"/>
  <text x="56" y="184" font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">await fetch(</text>
  <text x="56" y="204" font-family="Consolas, Menlo, monospace" font-size="12" fill="#86efac">  '…/users');</text>

  <!-- petición -->
  <line x1="250" y1="130" x2="640" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <rect x="300" y="100" width="290" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="314" y="122" font-size="12.5" font-weight="700" fill="#1d4ed8">PETICIÓN</text>
  <text x="314" y="144" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b"><tspan font-weight="700" fill="#1d4ed8">GET</tspan> https://api.ejemplo.com/users</text>

  <!-- respuesta -->
  <line x1="640" y1="210" x2="250" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <rect x="300" y="174" width="290" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="314" y="194" font-size="12.5" font-weight="700" fill="#15803d">RESPUESTA</text>
  <text x="314" y="214" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b"><tspan font-weight="700" fill="#15803d">200 OK</tspan> · Content-Type: JSON</text>
  <text x="314" y="230" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#475569">[{"id":1,"name":"Leanne"…}]</text>

  <rect x="646" y="92" width="230" height="150" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="761" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">🗄 Servidor (API)</text>
  <text x="761" y="150" text-anchor="middle" font-size="12" fill="#475569">Recibe la petición,</text>
  <text x="761" y="168" text-anchor="middle" font-size="12" fill="#475569">busca los datos y</text>
  <text x="761" y="186" text-anchor="middle" font-size="12" fill="#475569">contesta con un código</text>
  <text x="761" y="204" text-anchor="middle" font-size="12" fill="#475569">y, normalmente, JSON</text>

  <!-- códigos -->
  <text x="24" y="276" font-size="14" font-weight="700" fill="#334155">Los códigos de estado: el primer dígito dice qué ha pasado</text>
  <g font-size="12.5">
    <rect x="24" y="290" width="164" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="316" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#64748b">1xx</text>
    <text x="40" y="340" fill="#334155">Informativos</text>
    <text x="40" y="360" fill="#64748b">(casi nunca los veréis)</text>

    <rect x="196" y="290" width="164" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="212" y="316" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#15803d">2xx</text>
    <text x="212" y="340" fill="#334155">Éxito</text>
    <text x="212" y="360" font-family="Consolas, Menlo, monospace" fill="#166534">200 OK</text>
    <text x="212" y="380" font-family="Consolas, Menlo, monospace" fill="#166534">201 Created</text>
    <text x="212" y="400" font-size="11.5" fill="#15803d">response.ok → true</text>

    <rect x="368" y="290" width="164" height="118" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="384" y="316" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1d4ed8">3xx</text>
    <text x="384" y="340" fill="#334155">Redirecciones</text>
    <text x="384" y="360" fill="#64748b">(fetch las sigue solo)</text>

    <rect x="540" y="290" width="164" height="118" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="556" y="316" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#c2410c">4xx</text>
    <text x="556" y="340" fill="#334155">Error del cliente</text>
    <text x="556" y="360" font-family="Consolas, Menlo, monospace" fill="#9a3412">404 Not Found</text>
    <text x="556" y="380" font-size="11.5" fill="#9a3412">la URL está mal…</text>

    <rect x="712" y="290" width="164" height="118" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="728" y="316" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#b91c1c">5xx</text>
    <text x="728" y="340" fill="#334155">Error del servidor</text>
    <text x="728" y="360" font-family="Consolas, Menlo, monospace" fill="#991b1b">500 Internal…</text>
    <text x="728" y="380" font-size="11.5" fill="#991b1b">no es culpa vuestra</text>
  </g>
</svg>

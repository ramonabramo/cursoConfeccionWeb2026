<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Delegación de eventos</title>
  <desc>En lugar de un escuchador por elemento, uno solo en el contenedor aprovecha la burbuja y funciona también con elementos creados después.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Delegación: un escuchador para todos</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Gracias a la burbuja, el contenedor se entera de los clics de todos sus hijos</text>

  <!-- sin delegación -->
  <rect x="24" y="88" width="414" height="292" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="118" font-size="15" font-weight="700" fill="#b91c1c">✘ Un escuchador por elemento</text>
  <rect x="44" y="134" width="374" height="138" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="13">
    <rect x="60" y="148" width="250" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="72" y="168" fill="#1e293b">Tarea 1</text><text x="330" y="168" fill="#b91c1c">👂</text>
    <rect x="60" y="186" width="250" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="72" y="206" fill="#1e293b">Tarea 2</text><text x="330" y="206" fill="#b91c1c">👂</text>
    <rect x="60" y="224" width="250" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/><text x="72" y="244" fill="#1e293b">Tarea nueva</text><text x="330" y="244" fill="#b91c1c">🙉</text>
  </g>
  <text x="44" y="300" font-size="13" fill="#334155">• Con 100 tareas, 100 escuchadores.</text>
  <text x="44" y="322" font-size="13" fill="#334155">• Las tareas creadas DESPUÉS no tienen</text>
  <text x="44" y="342" font-size="13" fill="#334155">  escuchador: no responden.</text>

  <!-- con delegación -->
  <rect x="462" y="88" width="414" height="292" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="482" y="118" font-size="15" font-weight="700" fill="#15803d">✔ Un escuchador en el contenedor</text>
  <rect x="482" y="134" width="374" height="138" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="826" y="160" font-size="18">👂</text>
  <g font-size="13">
    <rect x="498" y="148" width="250" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="510" y="168" fill="#1e293b">Tarea 1</text>
    <rect x="498" y="186" width="250" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="510" y="206" fill="#1e293b">Tarea 2</text>
    <rect x="498" y="224" width="250" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/><text x="510" y="244" fill="#1e293b">Tarea nueva ✔</text>
  </g>
  <rect x="482" y="284" width="374" height="84" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">
    <text x="494" y="304">lista.addEventListener(<tspan fill="#86efac">'click'</tspan>, (e) =&gt; {</text>
    <text x="510" y="322"><tspan fill="#93c5fd">const</tspan> li = e.target.closest(<tspan fill="#86efac">'li'</tspan>);</text>
    <text x="510" y="340"><tspan fill="#c4b5fd">if</tspan> (!li) <tspan fill="#fca5a5">return</tspan>;  <tspan fill="#94a3b8">// clic fuera de un li</tspan></text>
    <text x="494" y="358">});</text>
  </g>
</svg>

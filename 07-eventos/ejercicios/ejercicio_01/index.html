<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 01 · Contador de clics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>👆 Contador de clics</h1>
        <p class="descripcion">Vuestro primer programa con eventos: no hace nada… hasta que pulsáis un botón.</p>

        <p id="contador" class="contador">0</p>

        <div class="botonera">
            <button id="btnMenos" class="btn btn--secundario">− 1</button>
            <button id="btnMas" class="btn">+ 1</button>
            <button id="btnReiniciar" class="btn btn--peligro">Reiniciar</button>
        </div>

        <p id="aviso" class="salida salida--secundaria">El botón +1 se bloquea al llegar a 10.</p>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

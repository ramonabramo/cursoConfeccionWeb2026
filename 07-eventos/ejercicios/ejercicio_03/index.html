<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 03 · Mini-tuit con atajos de teclado</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>💬 Mini-tuit</h1>
        <p class="descripcion">Escribid un mensaje de 140 caracteres como máximo. <strong>Ctrl + Enter</strong> lo publica y <strong>Escape</strong> lo borra.</p>

        <textarea id="texto" placeholder="¿Qué está pasando?"></textarea>
        <p id="caracteres" class="contador-caracteres">0 / 140</p>

        <div class="botonera">
            <button id="btnPublicar" class="btn" disabled>Publicar</button>
        </div>

        <h2>Publicados</h2>
        <ul id="tuits" class="lista"></ul>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

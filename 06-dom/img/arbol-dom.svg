<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Del HTML al árbol del DOM</title>
  <desc>El navegador convierte el código HTML en un árbol de nodos: cada etiqueta es un nodo elemento y el texto, un nodo de texto.</desc>
  <rect width="900" height="460" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Del HTML al árbol del DOM</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">El navegador lee vuestro HTML y construye en memoria un árbol. JavaScript trabaja con el árbol.</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <!-- código -->
  <rect x="24" y="90" width="300" height="300" rx="12" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#e2e8f0">
    <text x="44" y="122"><tspan fill="#fdba74">&lt;html&gt;</tspan></text>
    <text x="60" y="148"><tspan fill="#fdba74">&lt;head&gt;</tspan>…<tspan fill="#fdba74">&lt;/head&gt;</tspan></text>
    <text x="60" y="174"><tspan fill="#fdba74">&lt;body&gt;</tspan></text>
    <text x="76" y="200"><tspan fill="#fdba74">&lt;h1&gt;</tspan>Mi lista<tspan fill="#fdba74">&lt;/h1&gt;</tspan></text>
    <text x="76" y="226"><tspan fill="#fdba74">&lt;ul</tspan> <tspan fill="#93c5fd">id</tspan>=<tspan fill="#86efac">"lista"</tspan><tspan fill="#fdba74">&gt;</tspan></text>
    <text x="92" y="252"><tspan fill="#fdba74">&lt;li&gt;</tspan>Pan<tspan fill="#fdba74">&lt;/li&gt;</tspan></text>
    <text x="92" y="278"><tspan fill="#fdba74">&lt;li&gt;</tspan>Leche<tspan fill="#fdba74">&lt;/li&gt;</tspan></text>
    <text x="76" y="304"><tspan fill="#fdba74">&lt;/ul&gt;</tspan></text>
    <text x="60" y="330"><tspan fill="#fdba74">&lt;/body&gt;</tspan></text>
    <text x="44" y="356"><tspan fill="#fdba74">&lt;/html&gt;</tspan></text>
  </g>

  <line x1="332" y1="240" x2="372" y2="240" stroke="#64748b" stroke-width="2.5" marker-end="url(#f)"/>

  <!-- árbol -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="620" y1="118" x2="620" y2="142"/>
    <line x1="620" y1="168" x2="500" y2="196"/>
    <line x1="620" y1="168" x2="740" y2="196"/>
    <line x1="740" y1="222" x2="640" y2="256"/>
    <line x1="740" y1="222" x2="820" y2="256"/>
    <line x1="640" y1="282" x2="640" y2="312"/>
    <line x1="820" y1="282" x2="760" y2="320"/>
    <line x1="820" y1="282" x2="860" y2="320"/>
    <line x1="760" y1="346" x2="760" y2="376"/>
    <line x1="860" y1="346" x2="860" y2="376"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="566" y="94" width="108" height="26" rx="13" fill="#1e293b"/><text x="620" y="112" fill="#ffffff">document</text>
    <rect x="584" y="144" width="72" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="620" y="162" fill="#9a3412">html</text>
    <rect x="464" y="196" width="72" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="500" y="214" fill="#9a3412">head</text>
    <rect x="704" y="196" width="72" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="740" y="214" fill="#9a3412">body</text>
    <rect x="610" y="256" width="60" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="640" y="274" fill="#9a3412">h1</text>
    <rect x="770" y="256" width="100" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="820" y="274" fill="#1e40af">ul#lista</text>
    <rect x="730" y="320" width="60" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="760" y="338" fill="#9a3412">li</text>
    <rect x="830" y="320" width="60" height="26" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="860" y="338" fill="#9a3412">li</text>
  </g>
  <g font-size="12.5" text-anchor="middle" font-style="italic" fill="#15803d">
    <rect x="596" y="312" width="88" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="640" y="329">"Mi lista"</text>
    <rect x="726" y="376" width="68" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="760" y="393">"Pan"</text>
    <rect x="818" y="376" width="76" height="24" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="856" y="393">"Leche"</text>
  </g>

  <!-- leyenda -->
  <g font-size="12">
    <rect x="390" y="300" width="14" height="14" rx="3" fill="#fff7ed" stroke="#ea580c"/><text x="410" y="312" fill="#475569">Nodo elemento (etiqueta)</text>
    <rect x="390" y="324" width="14" height="14" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="410" y="336" fill="#475569">Nodo de texto</text>
    <text x="390" y="368" fill="#475569"><tspan font-weight="700">ul</tspan> es el <tspan font-weight="700">padre</tspan> de los dos li.</text>
    <text x="390" y="388" fill="#475569">Los dos li son <tspan font-weight="700">hijos</tspan> de ul y</text>
    <text x="390" y="406" fill="#475569"><tspan font-weight="700">hermanos</tspan> entre sí.</text>
  </g>
  <text x="450" y="440" text-anchor="middle" font-size="13" fill="#1e293b">Cambiar el árbol = cambiar lo que se ve. Sin recargar la página.</text>
</svg>

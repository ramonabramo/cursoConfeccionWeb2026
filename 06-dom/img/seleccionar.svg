<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>querySelector frente a querySelectorAll</title>
  <desc>querySelector devuelve el primer elemento que encaja o null; querySelectorAll devuelve una NodeList con todos, que admite forEach pero no map ni filter.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Seleccionar: uno o todos</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Los dos usan selectores CSS, los mismos que ya conocéis: 'p', '#id', '.clase', 'ul li'…</text>

  <!-- página -->
  <rect x="24" y="90" width="210" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="116" font-size="12" font-weight="700" fill="#475569">LA PÁGINA</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <rect x="44" y="132" width="170" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="58" y="154" fill="#1e293b">li.tarea</text>
    <rect x="44" y="176" width="170" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="58" y="198" fill="#1e293b">li.tarea</text>
    <rect x="44" y="220" width="170" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="58" y="242" fill="#1e293b">li.tarea</text>
    <rect x="44" y="264" width="170" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="58" y="286" fill="#94a3b8">p.nota</text>
  </g>

  <!-- querySelector -->
  <rect x="258" y="90" width="300" height="290" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="278" y="120" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#1d4ed8">querySelector('.tarea')</text>
  <text x="278" y="148" font-size="13" fill="#334155">Devuelve el <tspan font-weight="700">PRIMERO</tspan> que encaja:</text>
  <rect x="278" y="160" width="170" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="292" y="182" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">li.tarea</text>
  <text x="278" y="226" font-size="13" fill="#334155">Si no encuentra ninguno:</text>
  <text x="278" y="250" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#b91c1c">null</text>
  <text x="278" y="290" font-size="12.5" fill="#475569">Usadlo para elementos únicos:</text>
  <text x="278" y="308" font-size="12.5" fill="#475569">un botón, un formulario, la salida…</text>
  <text x="278" y="350" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1d4ed8">el.textContent = '…'  ✔</text>

  <!-- querySelectorAll -->
  <rect x="576" y="90" width="300" height="290" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="596" y="120" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#15803d">querySelectorAll('.tarea')</text>
  <text x="596" y="148" font-size="13" fill="#334155">Devuelve <tspan font-weight="700">TODOS</tspan> en una NodeList:</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <rect x="596" y="160" width="84" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="606" y="182" fill="#1e293b">li [0]</text>
    <rect x="684" y="160" width="84" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="694" y="182" fill="#1e293b">li [1]</text>
    <rect x="772" y="160" width="84" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="782" y="182" fill="#1e293b">li [2]</text>
  </g>
  <text x="596" y="226" font-size="13" fill="#334155">Si no hay ninguno: lista vacía</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <text x="596" y="262" fill="#15803d">lista.length, lista[0]       ✔</text>
    <text x="596" y="284" fill="#15803d">lista.forEach(…)             ✔</text>
    <text x="596" y="306" fill="#b91c1c">lista.map(…), lista.filter(…) ✘</text>
    <text x="596" y="336" fill="#1d4ed8">Array.from(lista).map(…)     ✔</text>
  </g>
  <text x="596" y="364" font-size="12.5" fill="#475569">Parece un array, pero no lo es.</text>
</svg>

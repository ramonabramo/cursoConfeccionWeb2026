<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>style frente a classList</title>
  <desc>style escribe estilos en línea desde JavaScript; classList añade o quita clases definidas en el CSS, que es la forma recomendada.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Cambiar el aspecto: style frente a classList</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">El mismo resultado, pero ¿dónde vive el diseño?</text>

  <!-- style -->
  <rect x="24" y="88" width="414" height="292" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="44" y="118" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#c2410c">elemento.style</text>
  <rect x="44" y="132" width="374" height="74" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#e2e8f0">
    <text x="58" y="158">tarjeta.style.backgroundColor = <tspan fill="#fdba74">'gold'</tspan>;</text>
    <text x="58" y="184">tarjeta.style.fontWeight = <tspan fill="#fdba74">'bold'</tspan>;</text>
  </g>
  <text x="44" y="234" font-size="13" fill="#334155">Escribe un estilo en línea en el HTML:</text>
  <text x="44" y="254" font-family="Consolas, Menlo, monospace" font-size="12" fill="#9a3412">&lt;div style="background-color: gold; …"&gt;</text>
  <text x="44" y="290" font-size="13" fill="#334155">✔ Útil para valores calculados al momento</text>
  <text x="44" y="310" font-size="13" fill="#334155">   (una anchura en %, una posición…)</text>
  <text x="44" y="338" font-size="13" fill="#b91c1c">✘ El diseño acaba repartido por el JavaScript</text>
  <text x="44" y="358" font-size="13" fill="#b91c1c">✘ Propiedades en camelCase: backgroundColor</text>

  <!-- classList -->
  <rect x="462" y="88" width="414" height="292" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="482" y="118" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#15803d">elemento.classList</text>
  <rect x="482" y="132" width="180" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="494" y="150" font-size="11" font-weight="700" fill="#475569">style.css</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#1e293b">
    <text x="494" y="170">.destacada {</text>
    <text x="506" y="186">background: gold;</text>
    <text x="494" y="200">}</text>
  </g>
  <rect x="672" y="132" width="186" height="74" rx="8" fill="#1e293b"/>
  <text x="684" y="150" font-size="11" font-weight="700" fill="#94a3b8">app.js</text>
  <text x="684" y="176" font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">tarjeta.classList</text>
  <text x="684" y="194" font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">  .add(<tspan fill="#86efac">'destacada'</tspan>);</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="482" y="236" fill="#1e293b">.add('x')</text><text x="640" y="236" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#334155">pone la clase</text>
    <text x="482" y="260" fill="#1e293b">.remove('x')</text><text x="640" y="260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#334155">la quita</text>
    <text x="482" y="284" fill="#1e293b">.toggle('x')</text><text x="640" y="284" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#334155">la pone si no está y al revés</text>
    <text x="482" y="308" fill="#1e293b">.contains('x')</text><text x="640" y="308" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#334155">¿la tiene? true / false</text>
  </g>
  <text x="482" y="342" font-size="13" font-weight="700" fill="#15803d">★ La que usamos por defecto: el diseño se queda</text>
  <text x="482" y="360" font-size="13" font-weight="700" fill="#15803d">   en el CSS y JavaScript solo decide qué clase toca</text>
</svg>

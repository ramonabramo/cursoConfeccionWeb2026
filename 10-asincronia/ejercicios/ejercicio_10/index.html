<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 · Reloj y fecha en vivo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>🕰️ Reloj y fecha en vivo</h1>
        <p id="reloj" class="reloj" aria-live="off">--:--:--</p>
        <p id="fecha" class="fecha-larga">…</p>

        <table class="tabla">
            <thead><tr><th>Dato</th><th>Valor</th></tr></thead>
            <tbody>
                <tr><td><code>getDay()</code></td><td id="resDia" class="resultado">?</td></tr>
                <tr><td><code>getMonth()</code></td><td id="resMes" class="resultado">?</td></tr>
                <tr><td>Día del año</td><td id="resDiaAnio" class="resultado">?</td></tr>
                <tr><td>Con <code>Intl.DateTimeFormat</code> (en inglés)</td><td id="resIngles" class="resultado">?</td></tr>
            </tbody>
        </table>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 · La máquina de escribir</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>⌨️ La máquina de escribir</h1>
        <p class="descripcion">El texto aparece letra a letra. Si pulsáis otra frase a mitad, la anterior se interrumpe.</p>

        <div class="botonera">
            <button class="btn" data-frase="0">Frase 1</button>
            <button class="btn" data-frase="1">Frase 2</button>
            <button class="btn" data-frase="2">Frase 3</button>
            <button id="btnParar" class="btn btn--secundario">Parar</button>
        </div>
        <p class="maquina"><span id="texto"></span><span class="cursor" aria-hidden="true">▍</span></p>
        <p id="estado" class="ayuda" aria-live="polite">Elegid una frase.</p>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

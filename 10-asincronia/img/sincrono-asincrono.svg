<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Síncrono frente a asíncrono</title>
  <desc>Analogía de una cafetería: en el modelo síncrono el camarero espera de brazos cruzados a que salga cada café; en el asíncrono encarga el café y sigue atendiendo mientras la cafetera trabaja.</desc>
  <rect width="900" height="420" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Síncrono frente a asíncrono: el camarero</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">JavaScript tiene un solo camarero. La clave es no dejarlo plantado delante de la cafetera.</text>

  <!-- síncrono -->
  <rect x="24" y="86" width="852" height="146" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="114" font-size="15" font-weight="700" fill="#b91c1c">✘ Síncrono: espera a que termine cada cosa</text>
  <g font-size="12.5">
    <rect x="44" y="132" width="110" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="99" y="154" text-anchor="middle" fill="#1e293b">Pedido mesa 1</text>
    <rect x="158" y="132" width="250" height="34" rx="6" fill="#fde68a" stroke="#ca8a04"/><text x="283" y="154" text-anchor="middle" fill="#78350f">☕ esperando la cafetera… 3 min</text>
    <rect x="412" y="132" width="110" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="467" y="154" text-anchor="middle" fill="#1e293b">Pedido mesa 2</text>
    <rect x="526" y="132" width="250" height="34" rx="6" fill="#fde68a" stroke="#ca8a04"/><text x="651" y="154" text-anchor="middle" fill="#78350f">☕ esperando… 3 min</text>
  </g>
  <text x="44" y="194" font-size="13" fill="#334155">Mientras espera, la mesa 2 está desatendida. En la web: la página se <tspan font-weight="700">congela</tspan>,</text>
  <text x="44" y="214" font-size="13" fill="#334155">los botones no responden y no se puede ni hacer scroll.</text>

  <!-- asíncrono -->
  <rect x="24" y="248" width="852" height="156" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="44" y="276" font-size="15" font-weight="700" fill="#15803d">✔ Asíncrono: encarga la tarea y sigue trabajando</text>
  <g font-size="12.5">
    <rect x="44" y="294" width="110" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="99" y="316" text-anchor="middle" fill="#1e293b">Pedido mesa 1</text>
    <rect x="158" y="294" width="110" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="213" y="316" text-anchor="middle" fill="#1e293b">Pedido mesa 2</text>
    <rect x="272" y="294" width="110" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="327" y="316" text-anchor="middle" fill="#1e293b">Cobra mesa 3</text>
    <rect x="386" y="294" width="170" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="471" y="316" text-anchor="middle" font-size="11.5" fill="#166534">🔔 café 1 listo: lo sirve</text>
    <rect x="158" y="336" width="250" height="24" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-dasharray="4 3"/><text x="283" y="353" text-anchor="middle" font-size="11.5" fill="#78350f">la cafetera trabaja por su cuenta</text>
  </g>
  <text x="590" y="310" font-size="13" fill="#334155">La cafetera = el navegador</text>
  <text x="590" y="328" font-size="13" fill="#334155">(temporizadores, red…).</text>
  <text x="590" y="346" font-size="13" fill="#334155">La campanita = un callback</text>
  <text x="590" y="364" font-size="13" fill="#334155">o una promesa que se cumple.</text>
  <text x="44" y="388" font-size="13" fill="#334155">La página sigue respondiendo mientras «se hace el café».</text>
</svg>

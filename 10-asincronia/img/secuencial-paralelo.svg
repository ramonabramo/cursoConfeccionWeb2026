<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Secuencial frente a Promise.all</title>
  <desc>Con await dentro de un bucle, cuatro tareas de 700 milisegundos se hacen una detrás de otra y tardan unos 2800 milisegundos. Con Promise.all empiezan todas a la vez y tardan lo que la más lenta, unos 700.</desc>
  <rect width="900" height="360" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Una detrás de otra, o todas a la vez</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Cuatro tareas independientes de 700 ms cada una</text>

  <!-- escala: 700 ms = 160 px, origen x = 200 -->
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <line x1="200" y1="86" x2="200" y2="300" stroke="#e2e8f0"/><text x="200" y="316">0</text>
    <line x1="360" y1="86" x2="360" y2="300" stroke="#e2e8f0"/><text x="360" y="316">700 ms</text>
    <line x1="520" y1="86" x2="520" y2="300" stroke="#e2e8f0"/><text x="520" y="316">1400 ms</text>
    <line x1="680" y1="86" x2="680" y2="300" stroke="#e2e8f0"/><text x="680" y="316">2100 ms</text>
    <line x1="840" y1="86" x2="840" y2="300" stroke="#e2e8f0"/><text x="840" y="316">2800 ms</text>
  </g>

  <text x="24" y="104" font-size="13" font-weight="700" fill="#b91c1c">await en un bucle</text>
  <text x="24" y="122" font-size="11.5" fill="#64748b">secuencial</text>
  <g font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="200" y="94" width="158" height="26" rx="5" fill="#f87171"/><text x="279" y="112">tarea 1</text>
    <rect x="360" y="124" width="158" height="26" rx="5" fill="#f87171"/><text x="439" y="142">tarea 2</text>
    <rect x="520" y="154" width="158" height="26" rx="5" fill="#f87171"/><text x="599" y="172">tarea 3</text>
    <rect x="680" y="184" width="158" height="26" rx="5" fill="#f87171"/><text x="759" y="202">tarea 4</text>
  </g>
  <text x="670" y="202" text-anchor="end" font-size="13" font-weight="700" fill="#b91c1c">≈ 2800: la suma de todas</text>

  <text x="24" y="238" font-size="13" font-weight="700" fill="#15803d">Promise.all</text>
  <text x="24" y="256" font-size="11.5" fill="#64748b">en paralelo</text>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="200" y="226" width="158" height="16" rx="4" fill="#22c55e"/><text x="279" y="238">1</text>
    <rect x="200" y="245" width="158" height="16" rx="4" fill="#22c55e"/><text x="279" y="257">2</text>
    <rect x="200" y="264" width="158" height="16" rx="4" fill="#22c55e"/><text x="279" y="276">3</text>
    <rect x="200" y="283" width="158" height="16" rx="4" fill="#22c55e"/><text x="279" y="295">4</text>
  </g>
  <text x="372" y="268" font-size="13" font-weight="700" fill="#15803d">≈ 700: lo que tarde la más lenta</text>

  <text x="450" y="344" text-anchor="middle" font-size="12.5" fill="#334155">Usad el bucle solo si cada paso necesita el resultado del anterior. Si una tarea de Promise.all falla, falla el conjunto.</text>
</svg>

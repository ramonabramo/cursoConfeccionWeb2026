<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 · Mi propio filter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>🔎 Mi propio <code>filter</code></h1>
        <p class="descripcion">Una función que filtra cualquier lista. Lo que se queda, lo decide otra función.</p>

        <table class="tabla">
            <thead><tr><th>Llamada</th><th>Resultado</th></tr></thead>
            <tbody>
                <tr><td><code>filtrar(numeros, esPar)</code></td><td id="res1" class="resultado">?</td></tr>
                <tr><td><code>filtrar(numeros, (n) =&gt; n &gt; 10)</code></td><td id="res2" class="resultado">?</td></tr>
                <tr><td><code>filtrar(nombres, empiezaPorA)</code></td><td id="res3" class="resultado">?</td></tr>
                <tr><td><code>numeros.filter(esPar)</code></td><td id="res4" class="resultado">?</td></tr>
            </tbody>
        </table>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

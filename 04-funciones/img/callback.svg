<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Qué es un callback</title>
  <desc>Una función se pasa como argumento a otra función, que decide cuándo llamarla.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Callback: una función que se pasa a otra</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">operar() no sabe qué operación hará. Se la decís vosotros al llamarla.</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <!-- funciones disponibles -->
  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <rect x="20" y="92" width="290" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="32" y="117" fill="#166534">const sumar = (a, b) =&gt; a + b;</text>
    <rect x="20" y="142" width="290" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="32" y="167" fill="#1e40af">const restar = (a, b) =&gt; a - b;</text>
    <rect x="20" y="192" width="290" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="32" y="217" fill="#9a3412">const mult = (a, b) =&gt; a * b;</text>
  </g>
  <text x="24" y="258" font-size="12" fill="#475569">Funciones guardadas en constantes:</text>
  <text x="24" y="276" font-size="12" fill="#475569">son valores, igual que un número.</text>

  <!-- operar -->
  <rect x="336" y="92" width="294" height="140" rx="14" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">
    <text x="350" y="126"><tspan fill="#c4b5fd">function</tspan> operar(a, b, <tspan fill="#fde047">fn</tspan>) {</text>
    <text x="370" y="160"><tspan fill="#fca5a5">return</tspan> <tspan fill="#fde047">fn</tspan>(a, b);</text>
    <text x="350" y="194">}</text>
  </g>
  <text x="480" y="218" text-anchor="middle" font-size="12" fill="#fde047">fn es el callback: se llama DENTRO</text>

  <!-- llamadas -->
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <rect x="330" y="262" width="300" height="34" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="346" y="284" fill="#1e293b">operar(8, 2, <tspan fill="#15803d" font-weight="700">sumar</tspan>)</text>
    <rect x="330" y="302" width="300" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="346" y="324" fill="#1e293b">operar(8, 2, <tspan fill="#1d4ed8" font-weight="700">restar</tspan>)</text>
    <rect x="330" y="342" width="300" height="34" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="346" y="364" fill="#1e293b">operar(8, 2, <tspan fill="#c2410c" font-weight="700">mult</tspan>)</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700">
    <line x1="636" y1="279" x2="700" y2="279" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/><text x="712" y="285" fill="#15803d">10</text>
    <line x1="636" y1="319" x2="700" y2="319" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/><text x="712" y="325" fill="#1d4ed8">6</text>
    <line x1="636" y1="359" x2="700" y2="359" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/><text x="712" y="365" fill="#c2410c">16</text>
  </g>

  <rect x="660" y="92" width="216" height="140" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="676" y="118" font-size="13" font-weight="700" fill="#b91c1c">⚠ Sin paréntesis</text>
  <text x="676" y="144" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">operar(8, 2, sumar)</text>
  <text x="676" y="164" font-size="12" fill="#15803d">✔ paso la función</text>
  <text x="676" y="192" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">operar(8, 2, sumar())</text>
  <text x="676" y="212" font-size="12" fill="#b91c1c">✘ la ejecuto y paso su resultado</text>
</svg>

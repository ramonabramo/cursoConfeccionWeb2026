<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Tres formas de escribir la misma función</title>
  <desc>Declaración de función, expresión de función y función flecha que calculan el doble de un número.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">La misma función, escrita de tres formas</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Las tres calculan el doble de un número y se llaman igual: doble(5) → 10</text>

  <!-- declaración -->
  <rect x="24" y="88" width="276" height="292" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="44" y="120" font-size="16" font-weight="700" fill="#5b21b6">Declaración</text>
  <rect x="40" y="136" width="244" height="92" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#e2e8f0">
    <text x="54" y="164"><tspan fill="#c4b5fd">function</tspan> doble(n) {</text>
    <text x="70" y="190"><tspan fill="#fca5a5">return</tspan> n * 2;</text>
    <text x="54" y="214">}</text>
  </g>
  <text x="44" y="258" font-size="12.5" fill="#334155">✔ Se puede llamar ANTES de la</text>
  <text x="44" y="276" font-size="12.5" fill="#334155">   línea donde está escrita (hoisting)</text>
  <text x="44" y="304" font-size="12.5" fill="#334155">✔ La más clara para empezar</text>
  <text x="44" y="356" font-size="12.5" font-weight="700" fill="#5b21b6">Uso: funciones principales</text>

  <!-- expresión -->
  <rect x="312" y="88" width="276" height="292" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="332" y="120" font-size="16" font-weight="700" fill="#1d4ed8">Expresión</text>
  <rect x="328" y="136" width="244" height="92" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#e2e8f0">
    <text x="342" y="164"><tspan fill="#93c5fd">const</tspan> doble = <tspan fill="#c4b5fd">function</tspan> (n) {</text>
    <text x="358" y="190"><tspan fill="#fca5a5">return</tspan> n * 2;</text>
    <text x="342" y="214">};</text>
  </g>
  <text x="332" y="258" font-size="12.5" fill="#334155">✔ La función se guarda en una</text>
  <text x="332" y="276" font-size="12.5" fill="#334155">   constante, como cualquier valor</text>
  <text x="332" y="304" font-size="12.5" fill="#b91c1c">✘ No se puede usar antes de</text>
  <text x="332" y="322" font-size="12.5" fill="#b91c1c">   la línea donde se define</text>
  <text x="332" y="356" font-size="12.5" font-weight="700" fill="#1d4ed8">Uso: puente hacia las flechas</text>

  <!-- flecha -->
  <rect x="600" y="88" width="276" height="292" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="620" y="120" font-size="16" font-weight="700" fill="#15803d">Flecha</text>
  <rect x="616" y="136" width="244" height="92" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#e2e8f0">
    <text x="630" y="164"><tspan fill="#93c5fd">const</tspan> doble = (n) <tspan fill="#86efac">=&gt;</tspan> {</text>
    <text x="646" y="190"><tspan fill="#fca5a5">return</tspan> n * 2;</text>
    <text x="630" y="214">};</text>
  </g>
  <text x="620" y="258" font-size="12.5" fill="#334155">Con una sola expresión, sin llaves</text>
  <text x="620" y="276" font-size="12.5" fill="#334155">ni return (retorno implícito):</text>
  <rect x="616" y="290" width="244" height="34" rx="8" fill="#1e293b"/>
  <text x="630" y="312" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e2e8f0"><tspan fill="#93c5fd">const</tspan> doble = n <tspan fill="#86efac">=&gt;</tspan> n * 2;</text>
  <text x="620" y="356" font-size="12.5" font-weight="700" fill="#15803d">Uso: funciones cortas y callbacks</text>
</svg>

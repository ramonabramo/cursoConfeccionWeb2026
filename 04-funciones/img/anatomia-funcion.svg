<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Anatomía de una función</title>
  <desc>Partes de la declaración de una función y cómo una llamada con argumentos produce un valor de retorno.</desc>
  <rect width="900" height="450" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Anatomía de una función</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Primero se declara (la receta). Después se llama (se cocina) tantas veces como queráis.</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <!-- DECLARACIÓN -->
  <text x="40" y="104" font-size="13" font-weight="700" fill="#475569">1 · DECLARAR</text>
  <rect x="40" y="114" width="520" height="132" rx="12" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="19">
    <text x="64" y="156"><tspan fill="#c4b5fd">function</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#fde047">calcularIva</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">precio</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">tipo</tspan><tspan fill="#e2e8f0">) {</tspan></text>
    <text x="96" y="192"><tspan fill="#fca5a5">return</tspan><tspan fill="#e2e8f0"> precio * tipo;</tspan></text>
    <text x="64" y="228" fill="#e2e8f0">}</text>
  </g>

  <g font-size="13">
    <rect x="590" y="114" width="270" height="34" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="606" y="136" fill="#5b21b6"><tspan font-weight="700">function</tspan> · palabra reservada</text>
    <rect x="590" y="154" width="270" height="34" rx="8" fill="#fefce8" stroke="#facc15"/>
    <text x="606" y="176" fill="#854d0e"><tspan font-weight="700">calcularIva</tspan> · nombre (un verbo)</text>
    <rect x="590" y="194" width="270" height="34" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="606" y="216" fill="#166534"><tspan font-weight="700">precio, tipo</tspan> · parámetros</text>
    <rect x="590" y="234" width="270" height="34" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="606" y="256" fill="#991b1b"><tspan font-weight="700">return</tspan> · lo que devuelve</text>
  </g>

  <!-- LLAMADA -->
  <text x="40" y="304" font-size="13" font-weight="700" fill="#475569">2 · LLAMAR</text>

  <rect x="40" y="316" width="190" height="104" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="135" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Argumentos</text>
  <text x="135" y="372" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1e293b">100, 0.21</text>
  <text x="135" y="398" text-anchor="middle" font-size="12" fill="#475569">los valores reales</text>

  <line x1="234" y1="368" x2="292" y2="368" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>

  <rect x="296" y="316" width="300" height="104" rx="12" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
  <text x="446" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">calcularIva(100, 0.21)</text>
  <text x="446" y="372" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">precio = 100 · tipo = 0.21</text>
  <text x="446" y="398" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">return 100 * 0.21</text>

  <line x1="600" y1="368" x2="658" y2="368" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>

  <rect x="662" y="316" width="198" height="104" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="761" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Valor devuelto</text>
  <text x="761" y="374" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#1e293b">21</text>
  <text x="761" y="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">const iva = calcularIva(…)</text>
</svg>

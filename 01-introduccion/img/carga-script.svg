<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Dónde colocar la etiqueta script</title>
  <desc>Comparativa en el tiempo de tres posiciones del script: en el head sin defer, al final del body y en el head con defer.</desc>
  <rect width="900" height="440" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">¿Dónde coloco el &lt;script&gt;?</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Lo que hace el navegador en cada caso, de izquierda a derecha en el tiempo</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <line x1="290" y1="90" x2="860" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="862" y="86" text-anchor="end" font-size="11" fill="#94a3b8">tiempo</text>

  <!-- Leyenda -->
  <g font-size="12">
    <rect x="290" y="402" width="16" height="12" rx="3" fill="#86efac"/><text x="312" y="412" fill="#475569">Leer el HTML</text>
    <rect x="420" y="402" width="16" height="12" rx="3" fill="#93c5fd"/><text x="442" y="412" fill="#475569">Descargar JS</text>
    <rect x="546" y="402" width="16" height="12" rx="3" fill="#fde047"/><text x="568" y="412" fill="#475569">Ejecutar JS</text>
  </g>

  <!-- Caso A -->
  <rect x="24" y="106" width="852" height="88" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="44" y="134" font-size="14" font-weight="700" fill="#b91c1c">✘ En el &lt;head&gt;</text>
  <text x="44" y="154" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">&lt;script src="app.js"&gt;</text>
  <text x="44" y="176" font-size="12" fill="#991b1b">Busca botones que aún no existen</text>
  <rect x="290" y="128" width="70" height="26" rx="5" fill="#86efac"/>
  <rect x="362" y="128" width="110" height="26" rx="5" fill="#93c5fd"/>
  <rect x="474" y="128" width="90" height="26" rx="5" fill="#fde047"/>
  <rect x="566" y="128" width="290" height="26" rx="5" fill="#86efac"/>
  <text x="519" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">querySelector → null</text>
  <text x="711" y="176" text-anchor="middle" font-size="12" fill="#475569">el body llega tarde</text>

  <!-- Caso B -->
  <rect x="24" y="206" width="852" height="88" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="44" y="234" font-size="14" font-weight="700" fill="#15803d">✔ Al final del &lt;body&gt;</text>
  <text x="44" y="254" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">…&lt;script src="app.js"&gt;</text>
  <text x="44" y="276" font-size="12" fill="#166534">Cuando se ejecuta, el HTML ya está</text>
  <rect x="290" y="228" width="360" height="26" rx="5" fill="#86efac"/>
  <rect x="652" y="228" width="110" height="26" rx="5" fill="#93c5fd"/>
  <rect x="764" y="228" width="90" height="26" rx="5" fill="#fde047"/>
  <text x="470" y="276" text-anchor="middle" font-size="12" fill="#475569">todo el HTML leído</text>
  <text x="760" y="276" text-anchor="middle" font-size="12" fill="#166534">empieza a descargar tarde</text>

  <!-- Caso C -->
  <rect x="24" y="306" width="852" height="88" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="44" y="334" font-size="14" font-weight="700" fill="#15803d">✔ En el &lt;head&gt; con defer</text>
  <text x="44" y="354" font-family="Consolas, Menlo, monospace" font-size="12" fill="#475569">&lt;script src="app.js" defer&gt;</text>
  <text x="44" y="376" font-size="12" fill="#166534">Descarga en paralelo, ejecuta al final</text>
  <rect x="290" y="322" width="360" height="22" rx="5" fill="#86efac"/>
  <rect x="300" y="348" width="110" height="22" rx="5" fill="#93c5fd"/>
  <rect x="652" y="334" width="90" height="26" rx="5" fill="#fde047"/>
  <text x="790" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">¡más rápido!</text>
</svg>

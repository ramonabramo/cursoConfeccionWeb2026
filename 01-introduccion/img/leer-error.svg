<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Cómo leer un error de la consola</title>
  <desc>Un mensaje de error tiene tres partes: el tipo, el mensaje y el fichero con la línea. Los tres tipos más habituales al empezar son SyntaxError, ReferenceError y TypeError. Cuando aparece un error, el script se detiene en esa línea.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Leer un error: tipo, mensaje y lugar</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">El error en rojo no es un enemigo: os dice qué ha pasado y dónde</text>

  <!-- consola -->
  <rect x="24" y="88" width="852" height="112" rx="12" fill="#1e293b"/>
  <circle cx="46" cy="108" r="6" fill="#f87171"/><circle cx="66" cy="108" r="6" fill="#fbbf24"/><circle cx="86" cy="108" r="6" fill="#34d399"/>
  <text x="110" y="113" font-size="12" fill="#94a3b8">Consola</text>
  <rect x="40" y="128" width="820" height="34" rx="6" fill="#7f1d1d" fill-opacity="0.55"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13.5">
    <text x="52" y="151" fill="#fecaca">⛔ Uncaught <tspan fill="#fca5a5" font-weight="700">TypeError</tspan>: <tspan fill="#fde68a">Cannot set properties of null (setting 'textContent')</tspan></text>
    <text x="790" y="151" fill="#93c5fd" text-decoration="underline">app.js:12</text>
  </g>
  <g font-size="12.5" font-weight="700">
    <line x1="170" y1="166" x2="170" y2="186" stroke="#fca5a5" stroke-width="2"/>
    <text x="170" y="196" text-anchor="middle" fill="#fca5a5">① tipo</text>
    <line x1="470" y1="166" x2="470" y2="186" stroke="#fde68a" stroke-width="2"/>
    <text x="470" y="196" text-anchor="middle" fill="#fde68a">② mensaje: qué ha pasado</text>
    <line x1="820" y1="166" x2="820" y2="186" stroke="#93c5fd" stroke-width="2"/>
    <text x="820" y="196" text-anchor="middle" fill="#93c5fd">③ fichero:línea</text>
  </g>

  <!-- tipos -->
  <g font-size="12.5">
    <rect x="24" y="220" width="270" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="40" y="246" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#c2410c">SyntaxError</text>
    <text x="40" y="270" fill="#334155">Algo está mal escrito:</text>
    <text x="40" y="288" fill="#334155">falta un paréntesis, unas comillas…</text>
    <text x="40" y="318" font-family="Consolas, Menlo, monospace" font-size="12" fill="#9a3412">console.log('Hola);</text>

    <rect x="314" y="220" width="270" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="330" y="246" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#6d28d9">ReferenceError</text>
    <text x="330" y="270" fill="#334155">Usáis un nombre que no existe</text>
    <text x="330" y="288" fill="#334155">(¡cuidado con las mayúsculas!)</text>
    <text x="330" y="318" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5b21b6">nombrecurso ≠ nombreCurso</text>

    <rect x="604" y="220" width="272" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="620" y="246" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#b91c1c">TypeError</text>
    <text x="620" y="270" fill="#334155">Usáis un valor de una forma</text>
    <text x="620" y="288" fill="#334155">que no admite</text>
    <text x="620" y="318" font-family="Consolas, Menlo, monospace" font-size="12" fill="#991b1b">null.textContent · console.lg()</text>
  </g>

  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#334155">🛑 Cuando JavaScript encuentra un error, <tspan font-weight="700">detiene el script</tspan> en esa línea: lo que viene después no se ejecuta.</text>
  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#64748b">Por eso un solo error puede hacer que «no funcione nada». Pulsad en app.js:12 y el navegador os lleva a la línea.</text>
</svg>

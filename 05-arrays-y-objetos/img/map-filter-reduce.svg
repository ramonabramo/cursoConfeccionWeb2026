<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>map, filter y reduce</title>
  <desc>map transforma cada elemento, filter se queda con algunos y reduce los combina en un único valor. El array original no cambia.</desc>
  <rect width="900" height="420" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">map · filter · reduce</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Los tres reciben un callback y devuelven algo NUEVO. El array original no se toca.</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <!-- original -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">
    <text x="130" y="98" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">precios</text>
    <rect x="40" y="108" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="62" y="134" fill="#1e293b">5</text>
    <rect x="88" y="108" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="110" y="134" fill="#1e293b">30</text>
    <rect x="136" y="108" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="158" y="134" fill="#1e293b">12</text>
    <rect x="184" y="108" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="206" y="134" fill="#1e293b">50</text>

    <text x="130" y="230" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">precios</text>
    <rect x="40" y="240" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="62" y="266" fill="#1e293b">5</text>
    <rect x="88" y="240" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="110" y="266" fill="#1e293b">30</text>
    <rect x="136" y="240" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="158" y="266" fill="#1e293b">12</text>
    <rect x="184" y="240" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="206" y="266" fill="#1e293b">50</text>

    <text x="130" y="350" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">precios</text>
    <rect x="40" y="360" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="62" y="386" fill="#1e293b">5</text>
    <rect x="88" y="360" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="110" y="386" fill="#1e293b">30</text>
    <rect x="136" y="360" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="158" y="386" fill="#1e293b">12</text>
    <rect x="184" y="360" width="44" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="206" y="386" fill="#1e293b">50</text>
  </g>

  <!-- map -->
  <line x1="240" y1="128" x2="300" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <rect x="306" y="96" width="290" height="64" rx="10" fill="#1e293b"/>
  <text x="322" y="120" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#93c5fd">.map(p =&gt; p * 2)</text>
  <text x="322" y="144" font-size="12" fill="#cbd5e1">TRANSFORMA cada uno · mismo tamaño</text>
  <line x1="600" y1="128" x2="646" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="654" y="108" width="52" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="680" y="134" fill="#1e40af">10</text>
    <rect x="710" y="108" width="52" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="736" y="134" fill="#1e40af">60</text>
    <rect x="766" y="108" width="52" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="792" y="134" fill="#1e40af">24</text>
    <rect x="822" y="108" width="52" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="848" y="134" fill="#1e40af">100</text>
  </g>

  <!-- filter -->
  <line x1="240" y1="260" x2="300" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <rect x="306" y="228" width="290" height="64" rx="10" fill="#1e293b"/>
  <text x="322" y="252" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#86efac">.filter(p =&gt; p &lt; 20)</text>
  <text x="322" y="276" font-size="12" fill="#cbd5e1">SE QUEDA con los que cumplen</text>
  <line x1="600" y1="260" x2="646" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="654" y="240" width="52" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="680" y="266" fill="#166534">5</text>
    <rect x="710" y="240" width="52" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="736" y="266" fill="#166534">12</text>
  </g>

  <!-- reduce -->
  <line x1="240" y1="380" x2="300" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <rect x="306" y="340" width="290" height="72" rx="10" fill="#1e293b"/>
  <text x="322" y="364" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#fde047">.reduce((acc, p) =&gt; acc + p, 0)</text>
  <text x="322" y="390" font-size="12" fill="#cbd5e1">COMBINA todos en UN valor</text>
  <line x1="600" y1="380" x2="646" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <rect x="654" y="358" width="80" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="694" y="387" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#854d0e">97</text>
  <text x="750" y="378" font-size="12" fill="#475569">0+5 → 5+30 → 35+12</text>
  <text x="750" y="396" font-size="12" fill="#475569">→ 47+50 → 97</text>
</svg>

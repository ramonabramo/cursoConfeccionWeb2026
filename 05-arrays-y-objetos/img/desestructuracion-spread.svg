<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Desestructuración, resto y spread</title>
  <desc>La desestructuración saca propiedades de un objeto por nombre y elementos de un array por posición. Los tres puntos a la izquierda recogen el resto; a la derecha despliegan los elementos: spread.</desc>
  <rect width="900" height="430" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Desestructurar para sacar, … para recoger o desplegar</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Los mismos tres puntos hacen cosas opuestas según el lado del =</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <g font-family="Consolas, Menlo, monospace" font-size="12.5">
    <!-- objeto -->
    <rect x="24" y="88" width="420" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="40" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">De un objeto: por NOMBRE</text>
    <text x="40" y="138" fill="#1e293b">usuario = { nombre: 'Ana', edad: 31 }</text>
    <text x="40" y="170" font-size="11.2" fill="#1e293b">const { <tspan fill="#6d28d9" font-weight="700">nombre</tspan>, edad: <tspan fill="#6d28d9" font-weight="700">años</tspan>, pais = <tspan fill="#15803d">'España'</tspan> } = usuario;</text>
    <text x="40" y="200" fill="#475569">nombre → 'Ana'   años → 31</text>
    <text x="40" y="222" fill="#475569">pais → 'España'  (no existía: valor por defecto)</text>

    <!-- array -->
    <rect x="456" y="88" width="420" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="472" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">De un array: por POSICIÓN</text>
    <text x="472" y="138" fill="#1e293b">equipo = ['Ana', 'Luis', 'Eva', 'Teo']</text>
    <text x="472" y="170" fill="#1e293b">const [<tspan fill="#1d4ed8" font-weight="700">primero</tspan>, <tspan fill="#1d4ed8" font-weight="700">segundo</tspan>, <tspan fill="#c2410c" font-weight="700">...resto</tspan>] = equipo;</text>
    <text x="472" y="200" fill="#475569">primero → 'Ana'   segundo → 'Luis'</text>
    <text x="472" y="222" fill="#c2410c">resto → ['Eva', 'Teo']   ← recoge</text>
  </g>

  <!-- spread -->
  <rect x="24" y="254" width="852" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="40" y="280" font-size="14" font-weight="700" fill="#15803d">Spread: a la DERECHA, los tres puntos despliegan</text>
  <g font-size="12.5">
    <rect x="40" y="296" width="120" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="100" y="318" text-anchor="middle" font-family="Consolas, Menlo, monospace">[🍎, 🍐]</text>
    <rect x="170" y="296" width="120" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="230" y="318" text-anchor="middle" font-family="Consolas, Menlo, monospace">[🥕, 🥬]</text>
    <line x1="296" y1="313" x2="336" y2="313" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
    <rect x="342" y="296" width="230" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="457" y="318" text-anchor="middle" font-family="Consolas, Menlo, monospace">[🍎, 🍐, 🥕, 🥬, 🍞]</text>
    <text x="590" y="318" font-family="Consolas, Menlo, monospace" fill="#1e293b">[...frutas, ...verduras, '🍞']</text>

    <text x="40" y="358" font-family="Consolas, Menlo, monospace" fill="#1e293b">const copia = [...original];</text>
    <text x="330" y="358" fill="#475569">un array nuevo (no la misma referencia)</text>
    <text x="40" y="380" font-family="Consolas, Menlo, monospace" fill="#1e293b">Math.max(...numeros);</text>
    <text x="330" y="380" fill="#475569">pasa los elementos sueltos, como argumentos</text>
    <text x="40" y="402" font-family="Consolas, Menlo, monospace" fill="#1e293b">{ ...porDefecto, ...delUsuario }</text>
    <text x="330" y="402" fill="#475569">une objetos: si una propiedad se repite, <tspan font-weight="700">gana la última</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Valores y referencias</title>
  <desc>Copiar un número crea otro valor independiente; copiar un array con = solo copia la referencia y las dos variables apuntan al mismo array; el spread crea un array nuevo.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">¿Copia o el mismo? Valores y referencias</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Con arrays y objetos, el = no copia el contenido: copia la dirección</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- primitivo -->
  <rect x="24" y="88" width="270" height="290" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="44" y="116" font-size="14" font-weight="700" fill="#15803d">Números, textos… (primitivos)</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">
    <text x="44" y="146">let a = 5;</text>
    <text x="44" y="166">let b = a;</text>
    <text x="44" y="186">b = 99;</text>
  </g>
  <rect x="64" y="210" width="80" height="50" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="104" y="242" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#1e293b">5</text>
  <text x="104" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">a</text>
  <rect x="174" y="210" width="80" height="50" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="214" y="242" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#1e293b">99</text>
  <text x="214" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">b</text>
  <text x="44" y="320" font-size="12.5" fill="#334155">Dos cajas independientes.</text>
  <text x="44" y="340" font-size="12.5" fill="#334155">Cambiar b no afecta a a.</text>

  <!-- referencia -->
  <rect x="314" y="88" width="270" height="290" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="334" y="116" font-size="14" font-weight="700" fill="#b91c1c">Arrays y objetos con =</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">
    <text x="334" y="146">const a = [1, 2];</text>
    <text x="334" y="166">const b = a;</text>
    <text x="334" y="186">b.push(3);</text>
  </g>
  <text x="364" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">a</text>
  <text x="364" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">b</text>
  <line x1="378" y1="222" x2="444" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <line x1="378" y1="276" x2="444" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <rect x="450" y="228" width="114" height="44" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="507" y="256" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#1e293b">[1, 2, 3]</text>
  <text x="334" y="320" font-size="12.5" fill="#334155">Un solo array, dos nombres.</text>
  <text x="334" y="340" font-size="12.5" font-weight="700" fill="#b91c1c">¡a también tiene el 3!</text>

  <!-- spread -->
  <rect x="604" y="88" width="272" height="290" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="624" y="116" font-size="14" font-weight="700" fill="#1d4ed8">Copia con spread [...a]</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">
    <text x="624" y="146">const a = [1, 2];</text>
    <text x="624" y="166">const b = [...a];</text>
    <text x="624" y="186">b.push(3);</text>
  </g>
  <text x="644" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">a</text>
  <line x1="658" y1="222" x2="720" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <rect x="726" y="202" width="96" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="774" y="228" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#1e293b">[1, 2]</text>
  <text x="644" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">b</text>
  <line x1="658" y1="276" x2="720" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <rect x="726" y="256" width="120" height="40" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="786" y="282" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#1e293b">[1, 2, 3]</text>
  <text x="624" y="320" font-size="12.5" fill="#334155">Dos arrays distintos.</text>
  <text x="624" y="340" font-size="12.5" fill="#334155">Ojo: copia solo el primer nivel</text>
  <text x="624" y="358" font-size="12.5" fill="#334155">(copia superficial).</text>
</svg>

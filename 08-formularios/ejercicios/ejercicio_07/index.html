<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 07 · Formulario dinámico: campos que aparecen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>🧾 Pedido con factura</h1>
        <p class="descripcion">Según lo que elijáis, aparecen campos nuevos y el total se recalcula solo.</p>

        <form id="pedido" novalidate>
            <div class="campo">
                <label for="cantidad">Cantidad de cajas (19,90 € cada una)</label>
                <input type="number" id="cantidad" name="cantidad" value="1" min="1" max="20" required>
            </div>

            <fieldset>
                <legend>Envío</legend>
                <label class="opcion"><input type="radio" name="envio" value="estandar" checked> Estándar · 3,95 €</label>
                <label class="opcion"><input type="radio" name="envio" value="urgente"> Urgente · 7,95 €</label>
                <label class="opcion"><input type="radio" name="envio" value="recogida"> Recogida en tienda · gratis</label>
            </fieldset>

            <div class="campo">
                <label class="opcion"><input type="checkbox" id="quieroFactura" name="quieroFactura"> Quiero factura</label>
            </div>

            <fieldset id="datosFactura" hidden>
                <legend>Datos de facturación</legend>
                <div class="campo">
                    <label for="nif">NIF</label>
                    <input type="text" id="nif" name="nif" pattern="[0-9]{8}[A-Za-z]">
                </div>
                <div class="campo">
                    <label for="razonSocial">Nombre o razón social</label>
                    <input type="text" id="razonSocial" name="razonSocial">
                </div>
            </fieldset>

            <p>Total: <span id="total" class="total">23.85 €</span></p>

            <div class="botonera">
                <button type="submit" class="btn">Confirmar pedido</button>
                <button type="button" id="btnLimpiar" class="btn btn--secundario">Empezar de nuevo</button>
            </div>
        </form>

        <pre id="resumen" class="ticket">…</pre>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>El recorrido de un envío de formulario</title>
  <desc>El usuario envía; el formulario dispara submit; se anula la recarga con preventDefault; se leen y validan los datos; si hay errores se muestran, y si no se procesa y se reinicia el formulario.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Del botón «Enviar» al resultado</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">El escuchador va en el &lt;form&gt;, no en el botón</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <g font-size="13" text-anchor="middle">
    <rect x="24" y="96" width="150" height="80" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="99" y="128" font-weight="700" fill="#9a3412">① El usuario</text>
    <text x="99" y="148" fill="#334155">pulsa Enviar</text>
    <text x="99" y="164" fill="#334155">o Enter</text>

    <rect x="204" y="96" width="150" height="80" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="279" y="128" font-weight="700" fill="#5b21b6">② El form</text>
    <text x="279" y="148" fill="#334155">dispara</text>
    <text x="279" y="166" font-family="Consolas, Menlo, monospace" fill="#5b21b6">'submit'</text>

    <rect x="384" y="96" width="150" height="80" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="459" y="128" font-weight="700" fill="#b91c1c">③ Evitar recarga</text>
    <text x="459" y="152" font-family="Consolas, Menlo, monospace" font-size="12" fill="#b91c1c">e.preventDefault()</text>
    <text x="459" y="168" font-size="11.5" fill="#475569">¡lo primero!</text>

    <rect x="564" y="96" width="150" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="639" y="128" font-weight="700" fill="#1d4ed8">④ Leer datos</text>
    <text x="639" y="152" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1d4ed8">new FormData(form)</text>

    <rect x="744" y="96" width="132" height="80" rx="12" fill="#fefce8" stroke="#facc15"/>
    <text x="810" y="128" font-weight="700" fill="#854d0e">⑤ Validar</text>
    <text x="810" y="152" fill="#334155">¿todo bien?</text>
  </g>
  <line x1="176" y1="136" x2="200" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <line x1="356" y1="136" x2="380" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <line x1="536" y1="136" x2="560" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>
  <line x1="716" y1="136" x2="740" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#f)"/>

  <path d="M780,178 L780,200 L640,200 L640,218" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#f)"/>
  <text x="700" y="194" font-size="12" font-weight="700" fill="#dc2626">no</text>
  <path d="M840,178 L840,340 L716,340" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#f)"/>
  <text x="848" y="250" font-size="12" font-weight="700" fill="#16a34a">sí</text>

  <rect x="430" y="222" width="400" height="62" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="248" font-size="13" font-weight="700" fill="#b91c1c">⑥a Mostrar los errores</text>
  <text x="450" y="270" font-size="12.5" fill="#334155">junto a cada campo · aria-invalid · foco en el primero</text>

  <rect x="24" y="300" width="690" height="84" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="44" y="326" font-size="13" font-weight="700" fill="#15803d">⑥b Procesar</text>
  <text x="44" y="350" font-size="12.5" fill="#334155">Guardar o usar los datos · mostrar un mensaje de éxito ·</text>
  <text x="44" y="370" font-size="12.5" fill="#334155"><tspan font-family="Consolas, Menlo, monospace" fill="#15803d">form.reset()</tspan> para dejarlo limpio · devolver el foco al primer campo</text>
</svg>

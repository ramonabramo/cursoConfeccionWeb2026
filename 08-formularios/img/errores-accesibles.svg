<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Mostrar errores de forma accesible</title>
  <desc>Comparativa entre un error mal comunicado, solo con color rojo, y uno bien comunicado con texto, icono y atributos aria-invalid y aria-describedby.</desc>
  <rect width="900" height="400" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Un error que todo el mundo entiende</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">No todo el mundo distingue el rojo, y un lector de pantalla no ve colores</text>

  <!-- mal -->
  <rect x="24" y="88" width="414" height="292" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="118" font-size="15" font-weight="700" fill="#b91c1c">✘ Solo color</text>
  <text x="44" y="150" font-size="13" font-weight="600" fill="#1e293b">Email</text>
  <rect x="44" y="160" width="374" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="58" y="186" font-size="14" fill="#1e293b">lucia@</text>
  <text x="44" y="236" font-size="13" fill="#334155">• ¿Qué está mal? No lo dice.</text>
  <text x="44" y="260" font-size="13" fill="#334155">• Con daltonismo, el borde rojo</text>
  <text x="44" y="278" font-size="13" fill="#334155">  puede no distinguirse.</text>
  <text x="44" y="302" font-size="13" fill="#334155">• Un lector de pantalla no anuncia</text>
  <text x="44" y="320" font-size="13" fill="#334155">  nada: el campo «parece» correcto.</text>

  <!-- bien -->
  <rect x="462" y="88" width="414" height="292" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="482" y="118" font-size="15" font-weight="700" fill="#15803d">✔ Texto + icono + ARIA</text>
  <text x="482" y="150" font-size="13" font-weight="600" fill="#1e293b">Email</text>
  <rect x="482" y="160" width="374" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="496" y="186" font-size="14" fill="#1e293b">lucia@</text>
  <text x="482" y="222" font-size="13" font-weight="600" fill="#b91c1c">⚠ Falta el dominio: lucia@ejemplo.com</text>
  <rect x="482" y="238" width="374" height="126" rx="8" fill="#1e293b"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e2e8f0">
    <text x="494" y="260">&lt;input id=<tspan fill="#86efac">"email"</tspan></text>
    <text x="510" y="278"><tspan fill="#fde047">aria-invalid</tspan>=<tspan fill="#86efac">"true"</tspan></text>
    <text x="510" y="296"><tspan fill="#fde047">aria-describedby</tspan>=<tspan fill="#86efac">"error-email"</tspan>&gt;</text>
    <text x="494" y="320">&lt;p id=<tspan fill="#86efac">"error-email"</tspan>&gt;</text>
    <text x="510" y="338">⚠ Falta el dominio…</text>
    <text x="494" y="356">&lt;/p&gt;</text>
  </g>
</svg>

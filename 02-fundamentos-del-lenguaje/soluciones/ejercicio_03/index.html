<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 03 · Calculadora de operadores (Solución)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>🧮 Calculadora de operadores</h1>
        <p id="datos" class="descripcion">Introduce dos números y verás todas las operaciones a la vez.</p>

        <table class="tabla">
            <thead>
                <tr><th>Operación</th><th>Resultado</th></tr>
            </thead>
            <tbody>
                <tr><td><code>a + b</code></td><td id="suma" class="resultado">?</td></tr>
                <tr><td><code>a - b</code></td><td id="resta" class="resultado">?</td></tr>
                <tr><td><code>a * b</code></td><td id="multiplicacion" class="resultado">?</td></tr>
                <tr><td><code>a / b</code></td><td id="division" class="resultado">?</td></tr>
                <tr><td><code>a % b</code></td><td id="resto" class="resultado">?</td></tr>
                <tr><td><code>a ** b</code></td><td id="potencia" class="resultado">?</td></tr>
            </tbody>
        </table>

        <p class="ayuda">💡 Probad con 17 y 5. Después con 10 y 0. ¿Qué pasa al dividir entre cero?</p>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

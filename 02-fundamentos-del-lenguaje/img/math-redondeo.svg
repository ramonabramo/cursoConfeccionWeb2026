<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Redondear con Math y toFixed</title>
  <desc>Sobre una recta numérica entre 4 y 5: Math.floor siempre va hacia abajo, Math.ceil siempre hacia arriba y Math.round al entero más cercano. La fórmula del entero aleatorio usa Math.floor de Math.random por max más 1. toFixed devuelve un texto.</desc>
  <rect width="900" height="420" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Redondear: ¿hacia dónde va cada método?</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Tres métodos de Math y un detalle de toFixed que conviene no olvidar</text>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- recta -->
  <line x1="120" y1="190" x2="780" y2="190" stroke="#334155" stroke-width="3"/>
  <g font-family="Consolas, Menlo, monospace" font-weight="700">
    <line x1="150" y1="178" x2="150" y2="202" stroke="#334155" stroke-width="3"/>
    <text x="150" y="228" text-anchor="middle" font-size="20" fill="#1e293b">4</text>
    <line x1="750" y1="178" x2="750" y2="202" stroke="#334155" stroke-width="3"/>
    <text x="750" y="228" text-anchor="middle" font-size="20" fill="#1e293b">5</text>
    <line x1="450" y1="184" x2="450" y2="196" stroke="#94a3b8" stroke-width="2"/>
    <text x="450" y="228" text-anchor="middle" font-size="14" fill="#94a3b8">4.5</text>
  </g>
  <circle cx="210" cy="190" r="7" fill="#2563eb"/>
  <text x="210" y="168" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1d4ed8">4.1</text>
  <circle cx="690" cy="190" r="7" fill="#16a34a"/>
  <text x="690" y="168" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#15803d">4.9</text>

  <!-- flechas -->
  <path d="M 690 150 C 690 104, 600 98, 160 112" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#f)"/>
  <text x="440" y="98" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6d28d9">Math.floor(4.9) → 4  (siempre hacia abajo)</text>
  <path d="M 210 236 C 210 290, 300 296, 740 282" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#f)"/>
  <text x="470" y="312" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c2410c">Math.ceil(4.1) → 5  (siempre hacia arriba)</text>
  <text x="450" y="138" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">Math.round(4.5) → 5 · Math.round(4.1) → 4</text>

  <!-- abajo -->
  <rect x="24" y="334" width="420" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="40" y="358" font-size="13" font-weight="700" fill="#15803d">🎲 Un entero aleatorio entre 1 y max</text>
  <text x="40" y="386" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">Math.floor(Math.random() * max) + 1</text>

  <rect x="460" y="334" width="416" height="72" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="476" y="358" font-size="13" font-weight="700" fill="#b91c1c">⚠️ toFixed devuelve un TEXTO</text>
  <text x="476" y="386" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">(47.1537).toFixed(2) → "47.15"</text>
</svg>

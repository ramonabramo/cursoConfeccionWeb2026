<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Igualdad débil frente a igualdad estricta</title>
  <desc>El operador == convierte los tipos antes de comparar; el operador === exige mismo tipo y mismo valor.</desc>
  <rect width="900" height="360" rx="16" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">== frente a ===</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#64748b">Uno «hace la vista gorda» con los tipos. El otro, no.</text>

  <!-- == -->
  <rect x="24" y="88" width="414" height="250" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="44" y="122" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#c2410c">==</text>
  <text x="90" y="121" font-size="14" font-weight="600" fill="#9a3412">Igualdad débil</text>
  <text x="44" y="146" font-size="12" fill="#475569">Si los tipos son distintos, convierte uno y luego compara</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="60" y="190" fill="#1e293b">5 == '5'</text>          <text x="300" y="190" fill="#15803d">true</text>
    <text x="60" y="222" fill="#1e293b">0 == ''</text>           <text x="300" y="222" fill="#15803d">true</text>
    <text x="60" y="254" fill="#1e293b">null == undefined</text> <text x="300" y="254" fill="#15803d">true</text>
    <text x="60" y="286" fill="#1e293b">1 == true</text>         <text x="300" y="286" fill="#15803d">true</text>
  </g>
  <text x="44" y="322" font-size="12" font-weight="700" fill="#b91c1c">Resultados sorprendentes → no lo usamos</text>

  <!-- === -->
  <rect x="462" y="88" width="414" height="250" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="482" y="122" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#15803d">===</text>
  <text x="540" y="121" font-size="14" font-weight="600" fill="#166534">Igualdad estricta</text>
  <text x="482" y="146" font-size="12" fill="#475569">Si los tipos son distintos, directamente es false</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="498" y="190" fill="#1e293b">5 === '5'</text>          <text x="750" y="190" fill="#b91c1c">false</text>
    <text x="498" y="222" fill="#1e293b">0 === ''</text>           <text x="750" y="222" fill="#b91c1c">false</text>
    <text x="498" y="254" fill="#1e293b">null === undefined</text> <text x="750" y="254" fill="#b91c1c">false</text>
    <text x="498" y="286" fill="#1e293b">5 === 5</text>           <text x="750" y="286" fill="#15803d">true</text>
  </g>
  <text x="482" y="322" font-size="12" font-weight="700" fill="#15803d">★ Predecible → el que usamos siempre</text>
</svg>

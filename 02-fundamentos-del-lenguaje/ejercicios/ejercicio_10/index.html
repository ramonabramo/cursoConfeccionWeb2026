<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 · Datos de registro limpios</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>🧼 Datos de registro limpios</h1>
        <p class="descripcion">Los usuarios escriben como escriben. Este programa deja sus datos listos para guardar.</p>

        <table class="tabla">
            <thead><tr><th>Dato</th><th>Tal como llega</th><th>Limpio</th></tr></thead>
            <tbody>
                <tr><td>Nombre</td><td id="nombreOriginal">?</td><td id="nombreLimpio" class="resultado">?</td></tr>
                <tr><td>Correo</td><td id="correoOriginal">?</td><td id="correoLimpio" class="resultado">?</td></tr>
                <tr><td>Código postal</td><td id="cpOriginal">?</td><td id="cpLimpio" class="resultado">?</td></tr>
            </tbody>
        </table>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 · Intercambiar dos vasos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>🥤 Intercambiar dos vasos</h1>
        <p class="descripcion">Cada vaso tiene una bebida. El programa las cambia de vaso.</p>

        <table class="tabla">
            <thead><tr><th></th><th>Vaso A</th><th>Vaso B</th></tr></thead>
            <tbody>
                <tr><td>Antes</td><td id="antesA">?</td><td id="antesB">?</td></tr>
                <tr><td>Después</td><td id="despuesA" class="resultado">?</td><td id="despuesB" class="resultado">?</td></tr>
            </tbody>
        </table>
        <p class="ayuda">💡 Probad primero sin variable auxiliar: <code>a = b; b = a;</code>. ¿Qué bebida acaba en los dos vasos?</p>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>

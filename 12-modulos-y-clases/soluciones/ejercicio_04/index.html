<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 04 · Herencia: figuras geométricas (Solución)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>📐 Herencia: figuras geométricas</h1>
        <p class="descripcion">Tres clases hijas (<code>Circulo</code>, <code>Rectangulo</code> y <code>Triangulo</code>) heredan de <code>Figura</code>. Cada una calcula su área a su manera.</p>

        <form id="formFigura">
            <div class="campo">
                <label for="tipo">Figura</label>
                <select id="tipo" name="tipo">
                    <option value="circulo">Círculo</option>
                    <option value="rectangulo">Rectángulo</option>
                    <option value="triangulo">Triángulo</option>
                </select>
            </div>
            <div class="campo">
                <label for="dato1" id="etiqueta1">Radio</label>
                <input type="number" id="dato1" name="dato1" min="0.1" step="0.1" required>
            </div>
            <div class="campo" id="campo2" hidden>
                <label for="dato2" id="etiqueta2">Altura</label>
                <input type="number" id="dato2" name="dato2" min="0.1" step="0.1">
            </div>
            <button class="btn">Añadir figura</button>
        </form>

        <ul id="figuras" class="lista"></ul>
        <p id="resumen" class="salida" aria-live="polite">Todavía no hay figuras.</p>

        <div class="firma">Curso de JavaScript en el cliente · Realizado por Ramón Abramo</div>
    </main>
    <script src="app.js"></script>
</body>

</html>
